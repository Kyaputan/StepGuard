[project]
name = "stepguard"
version = "1.1.0"
description = "Real-time phone usage detection system on staircases Developed using **YOLO + OpenCV** with alert notifications and violator image logging to database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.0",
    "dotenv>=0.9.9",
    "langchain>=1.3.1",
    "langchain-google-genai>=4.2.3",
    "langchain-openai>=1.2.2",
    "lap>=0.5.13",
    "onnx>=1.19.0",
    "onnxruntime>=1.23.0",
    "onnxslim>=0.1.69",
    "opencv-python>=4.12.0.88",
    "openvino>=2025.3.0",
    "pydantic>=2.13.4",
    "pygame>=2.6.1",
    "requests>=2.32.5",
    "rich>=15.0.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "ultralytics>=8.3.203",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
